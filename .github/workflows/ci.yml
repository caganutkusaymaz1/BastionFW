name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests, coverage & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bastionfw
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bastionfw/requirements.lock

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest pytest-cov hypothesis bandit[toml]

      - name: Compile Python sources
        run: python -m compileall -q ed_bt_ade tests

      - name: Bandit static security analysis
        run: bandit -r ed_bt_ade -ll -q
        continue-on-error: false

      - name: Run tests with coverage gate (80%)
        run: >
          python -m pytest
          --cov=ed_bt_ade --cov-report=term-missing
          --cov-fail-under=80
          -q

      - name: Run tests (unittest suite parity)
        run: python -m unittest discover -s tests -q

  typescript:
    name: TypeScript checks & audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (fail on high or critical)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: false

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
        env:
          # Freebuff-injected build variables (vite configs require them);
          # CI builds use neutral placeholders.
          PORT: "8080"
          BASE_PATH: "/"

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: SBOM & container image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build bastionfw image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bastionfw:latest
          load: true

      - name: Build waf image (BastionFW Coraza layer)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./deploy/waf
          file: ./deploy/waf/Dockerfile
          push: false
          tags: waf:latest
          load: true

      # download-syft is a sub-action of the same sbom-action repository and
      # tag, so it resolves to the same commit.
      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM for bastionfw image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: bastionfw:latest
          format: cyclonedx-json
          artifact-name: sbom-bastionfw.cdx.json
          upload-artifact: true

      - name: Generate SBOM for waf image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: waf:latest
          format: cyclonedx-json
          artifact-name: sbom-waf.cdx.json
          upload-artifact: true

      - name: Generate SBOM for Python dependencies (from hash-pinned lock)
        run: |
          cp bastionfw/requirements.lock /tmp/requirements.txt
          syft scan dir:/tmp -o cyclonedx-json > sbom-python-deps.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python-deps.cdx.json
          path: sbom-python-deps.cdx.json

      # IaC misconfiguration lint via the official pinned action instead of
      # piping a remote install.sh into sh (A2). `trivy config` is the exact
      # sub-command the previous inline install used, with the same severity
      # gate and non-zero exit on findings.
      - name: Trivy config scan (Dockerfile hardening lint)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy config scan (Compose hardening lint)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy scan bastionfw image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bastionfw:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan waf image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: waf:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
