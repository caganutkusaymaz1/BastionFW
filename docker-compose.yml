services:
  bastionfw:
    build:
      context: .
      dockerfile: Dockerfile
    image: bastionfw:local
    restart: unless-stopped
    ports:
      - "${BASTIONFW_DASHBOARD_PORT:-8080}:8080"
      - "${BASTIONFW_METRICS_PORT:-9109}:9109"
    environment:
      ED_BT_ADE_DRY_RUN: "${ED_BT_ADE_DRY_RUN:-true}"
      ED_BT_ADE_LOG_LEVEL: "${ED_BT_ADE_LOG_LEVEL:-INFO}"
      # Dashboard auth: see .env.example. Empty -> loopback-only fail-safe.
      ED_BT_ADE_DASHBOARD_TOKEN: "${ED_BT_ADE_DASHBOARD_TOKEN:-}"
      # Coraza WAF integration (Faz 1/2): disabled by default.
      ED_BT_ADE_WAF_ENABLED: "${ED_BT_ADE_WAF_ENABLED:-false}"
      ED_BT_ADE_WAF_MODE: "${ED_BT_ADE_WAF_MODE:-detect}"
    volumes:
      - bastionfw-state:/var/lib/bastionfw
      # Dynamic deny-list + engine-mode file shared with the waf service.
      - bastionfw-waf:/var/lib/bastionfw/waf
      # Coraza JSON audit log (read-only here; the waf service writes it).
      - bastionfw-waf-audit:/var/log/waf:ro
      # Main Caddyfile, re-sent to the waf admin API on deny-list changes.
      - ./deploy/waf/Caddyfile:/etc/caddy/Caddyfile:ro
      - "${BASTIONFW_LOG_ROOT:-/var/log}:/host/var/log:ro"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9109/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Coraza WAF + OWASP CRS ingress. The image is built from
  # deploy/waf/Dockerfile (no official corazawaf/coraza-caddy image exists on
  # Docker Hub). WAF_MODE=detect is the safe default; block is explicit opt-in.
  waf:
    build:
      context: ./deploy/waf
    image: bastionfw-waf:local
    restart: unless-stopped
    ports:
      - "${WAF_PORT:-80}:8080"
    environment:
      WAF_MODE: "${WAF_MODE:-detect}"
      # The protected application behind the WAF (reverse-proxy target).
      UPSTREAM_URL: "${UPSTREAM_URL:-http://bastionfw:8080}"
    volumes:
      # BastionFW rewrites engine-mode.conf (deadman fail-open) and deny.caddy
      # (dynamic deny-list); Caddy re-reads both on each admin reload.
      - bastionfw-waf:/var/lib/bastionfw/waf
      - bastionfw-waf-audit:/var/log/waf
      - ./deploy/waf/Caddyfile:/etc/caddy/Caddyfile:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bastionfw-state:
  bastionfw-waf:
  bastionfw-waf-audit:
